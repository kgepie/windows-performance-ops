<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal forms — synthetic preview</title>
<link rel="stylesheet" href="../assets/portal-mobile.css"><link rel="stylesheet" href="../assets/portal-forms.css">
<style>body{margin:0;background:#f1f5f9}.preview-note{padding:10px 16px;background:#102d46;color:#fff;font:13px/1.5 sans-serif}.ops-shell{display:block}.ops-form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.sample-form{max-width:900px;padding:24px;margin-top:24px;background:#fff;border:1px solid #d6e2ed;border-radius:14px}.sample-form form{display:grid;gap:16px}.work-toolbar{margin-top:24px}.work-stock-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:16px;padding:20px;margin-top:12px;background:white;border:1px solid #d6e2ed;border-radius:12px}.ops-button{background:#086fc0;color:white;border:1px solid #086fc0}.ops-secondary{background:white;color:#102d46}.work-stock-row small{display:block;color:#526779}@media(max-width:700px){.work-stock-row{grid-template-columns:1fr 1fr}.work-stock-row>div:first-child{grid-column:1/-1}.sample-form{padding:18px}}</style></head>
<body><p class="preview-note">Synthetic form preview · No connection to live stock</p><main id="pwpc-operations" class="pwpc-ops"><div class="ops-shell"><div class="ops-workspace">
<p class="ops-eyebrow">Stock replenishment</p><h1>Your materials, in one place.</h1>
<div class="work-toolbar"><label class="work-search">Find a material<input type="search" placeholder="Item, code, location or supplier"></label><label class="work-filter"><input type="checkbox">Low stock only</label><label class="work-filter"><input type="checkbox">Archived items</label></div>
<div class="work-stock-row"><div><small>DEMO-001</small><strong>Frame corner cleats</strong><small>Example Bay B1</small></div><div><small>On hand / minimum</small><strong>80 / 40</strong></div><div><small>Preferred supplier</small><strong>Example supplier</strong></div><button class="ops-button ops-secondary" type="button">Edit</button></div>
<section class="sample-form"><h2>Stock item form</h2><form><div class="ops-form-row"><label>Item code<input value="DEMO-001" readonly></label><label>Material name<input value="Frame corner cleats"></label></div><div class="ops-form-row"><label>On hand<input type="number" value="80"></label><label>Minimum level<input type="number" value="40"></label></div><label>Notes<textarea>Keep the item code stable.</textarea></label><div class="ops-form-row"><label>Status<select><option>Active</option><option>Archived</option></select></label><label class="inv-check"><input type="checkbox">Training / demo item</label></div><label class="flow-check"><input type="checkbox">I have checked the item details and selected the correct company.</label><div class="inv-dialog-actions"><button class="ops-button ops-secondary" type="button">Cancel</button><button class="ops-button" type="submit">Save changes</button></div></form></section>
</div></div></main><script>document.querySelector('form').addEventListener('submit',e=>e.preventDefault())</script></body></html>
